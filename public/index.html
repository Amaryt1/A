<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة المفاتيح - IPA Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #fff; }
    .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #3b82f6; }
    .btn-primary { background-color: #2563eb; border: none; }
    .table { color: #f8fafc; }
  </style>
</head>
<body class="p-3 p-md-5">
  <div class="container" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>🔑 لوحة إدارة المفاتيح الاحترافية</h2>
      <span class="badge bg-success">متصل بـ Vercel</span>
    </div>

    <!-- بطاقة إنشاء مفتاح جديد -->
    <div class="card p-4 mb-4">
      <h5 class="card-title mb-3">توليد مفتاح جديد</h5>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">المدة الزمنية</label>
          <select id="durationType" class="form-select">
            <option value="1h">ساعة واحدة (1 Hour)</option>
            <option value="3h">3 ساعات (3 Hours)</option>
            <option value="1d">يوم واحد (24 Hours)</option>
            <option value="30d" selected>شهر واحد (30 Days)</option>
            <option value="60d">شهرين (60 Days)</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">البادئة (Prefix)</label>
          <input type="text" id="prefix" class="form-control" value="IPA-">
        </div>
        <div class="col-md-3">
          <label class="form-label">كلمة سر الآدمن</label>
          <input type="password" id="adminPass" class="form-control" value="123456">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button onclick="generateKey()" class="btn btn-primary w-100">إنشاء المفتاح</button>
        </div>
      </div>
    </div>

    <!-- جدول المفاتيح المفعلة -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title m-0">المفاتيح المسجلة باللوحة</h5>
        <button onclick="fetchKeys()" class="btn btn-sm btn-outline-light">تحديث 🔄</button>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
          <thead>
            <tr>
              <th>المفتاح (Code)</th>
              <th>المدة</th>
              <th>الأيام</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="keysTable">
            <tr><td colspan="4" class="text-center">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="mt-2 text-muted small">
        رابط الـ API المباشر للأداة: <a id="apiUrl" href="/api/keys" target="_blank" class="text-info">/api/keys</a>
      </div>
    </div>

  </div>

  <script>
    async function fetchKeys() {
      const res = await fetch('/api/keys');
      const data = await res.json();
      const tbody = document.getElementById('keysTable');
      tbody.innerHTML = '';

      if (!data.details || data.details.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">لا توجد مفاتيح حالياً</td></tr>';
        return;
      }

      data.details.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td><strong class="text-warning">${item.code}</strong></td>
            <td><span class="badge bg-info">${item.type}</span></td>
            <td>${item.days} يوم</td>
            <td>
              <button onclick="copyCode('${item.code}')" class="btn btn-sm btn-secondary me-1">نسخ</button>
              <button onclick="deleteKey('${item.code}')" class="btn btn-sm btn-danger">حذف</button>
            </td>
          </tr>
        `;
      });
    }

    async function generateKey() {
      const type = document.getElementById('durationType').value;
      const prefix = document.getElementById('prefix').value;
      const adminPass = document.getElementById('adminPass').value;

      let days = 30;
      if (type === '1h') days = 0.0416;
      else if (type === '3h') days = 0.125;
      else if (type === '1d') days = 1;
      else if (type === '30d') days = 30;
      else if (type === '60d') days = 60;

      const randomCode = prefix + Math.random().toString(36).substring(2, 8).toUpperCase();

      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'ADD',
          adminPass,
          keyData: { code: randomCode, type, days, created: Date.now() }
        })
      });

      if (res.ok) {
        alert('تم إنشاء المفتاح بنجاح: ' + randomCode);
        fetchKeys();
      } else {
        const err = await res.json();
        alert('خطأ: ' + err.error);
      }
    }

    async function deleteKey(code) {
      if (!confirm('هل أنت تأكد من حذف المفتاح: ' + code)) return;
      const adminPass = document.getElementById('adminPass').value;

      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'DELETE', adminPass, keyData: { code } })
      });

      if (res.ok) {
        fetchKeys();
      } else {
        alert('فشل الحذف، تأكد من كلمة السر');
      }
    }

    function copyCode(text) {
      navigator.clipboard.writeText(text);
      alert('تم نسخ الكود: ' + text);
    }

    fetchKeys();
  </script>
</body>
</html>
